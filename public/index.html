<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>整理券発行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ① メニュー選択画面 -->
  <div id="screen-menu" class="screen active">
    <header class="page-header">
      <h1>ご注文</h1>
    </header>

    <main class="menu-list">
      <h2 class="menu-section-title">🔥 お得なセット</h2>
      <div id="set-list"></div>

      <h2 class="menu-section-title">単品</h2>
      <div id="single-list"></div>

      <p class="soup-note">※ お支払いは受け取り時に<strong>現金のみ</strong>となります</p>
    </main>

    <footer class="sticky-footer">
      <div class="total-bar">
        <span>合計</span>
        <span id="menu-total" class="total-amount">¥0</span>
      </div>
      <button id="btn-order" class="btn-primary" onclick="goToConfirmScreen()" disabled>注文内容を確認</button>
    </footer>
  </div>

  <!-- ② 確認・お名前入力画面 -->
  <div id="screen-confirm" class="screen">
    <header class="page-header">
      <button class="back-btn" onclick="showScreen('menu')">← 戻る</button>
      <h1>ご注文確認</h1>
    </header>

    <main>
      <section class="order-summary">
        <h2 class="section-title">ご注文内容</h2>
        <ul id="confirm-order-list" class="order-list"></ul>
        <div class="order-total">
          <span>合計</span>
          <span id="confirm-total" class="total-amount"></span>
        </div>
      </section>

      <section class="name-section">
        <label class="name-label" for="customer-name">お名前（受け取り用）</label>
        <input
          id="customer-name"
          class="name-input"
          type="text"
          placeholder="例：田中"
          maxlength="30"
          oninput="onNameInput()"
        >
      </section>

      <div class="info-box">お支払いは受け取り時に現金でお願いします</div>

      <p id="issue-error" class="issue-error" style="display:none">整理券の発行に失敗しました。もう一度お試しください。</p>

      <div class="screen-actions">
        <button id="btn-issue" class="btn-primary" onclick="issueTicket()" disabled>整理券を発行する</button>
      </div>
    </main>
  </div>

  <!-- ③ 整理券画面 -->
  <div id="screen-ticket" class="screen">
    <header class="page-header">
      <h1>整理券</h1>
    </header>

    <main>
      <section class="ticket">
        <p class="ticket-label">整理券番号</p>
        <p id="ticket-number" class="ticket-number"></p>
        <p id="ticket-name" class="ticket-name"></p>
      </section>

      <section class="order-summary">
        <h2 class="section-title">ご注文内容</h2>
        <ul id="ticket-order-list" class="order-list"></ul>
        <div class="order-total">
          <span>お支払い金額（現金）</span>
          <span id="ticket-total" class="total-amount"></span>
        </div>
      </section>

      <div class="info-box">
        番号を呼ばれたら、この画面をスタッフに見せて<br>現金でお支払いください
      </div>

      <div class="screen-actions">
        <button class="btn-secondary" onclick="startNewOrder()">新しく注文する</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
