<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:#FAFAF9; min-height:100vh;">

  <!-- ログインオーバーレイ -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h2>管理者パスワード</h2>
      <p id="login-error" class="login-error" style="display:none">パスワードが違います</p>
      <input id="admin-password" type="password" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')login()">
      <button class="btn-primary" onclick="login()">ログイン</button>
    </div>
  </div>

  <!-- 管理画面 -->
  <div class="admin-wrap" id="admin-content" style="display:none">
    <div class="admin-header">
      <h1>注文管理</h1>
      <div class="admin-header-right">
        <span id="last-updated" class="last-updated"></span>
        <button class="btn-refresh" onclick="loadOrders()">更新</button>
      </div>
    </div>

    <nav class="view-tabs" id="view-tabs">
      <button class="view-tab active" data-view="orders" onclick="setView('orders')">注文</button>
      <button class="view-tab" data-view="stock" onclick="setView('stock')">在庫</button>
      <button class="view-tab" data-view="report" onclick="setView('report')">集計</button>
    </nav>

    <!-- 注文 -->
    <section id="view-orders" class="admin-view active">
      <div class="admin-stats" id="admin-stats"></div>

      <div class="order-toolbar">
        <div class="filter-tabs" id="filter-tabs"></div>
        <input id="order-search" class="order-search" type="search" placeholder="注文番号・名前で検索" autofocus oninput="onSearchInput()">
      </div>

      <div id="orders-container">
        <div class="empty-state">読み込み中...</div>
      </div>
    </section>

    <!-- 在庫 -->
    <section id="view-stock" class="admin-view">
      <p class="view-note">残り数を入れると、注文ごとに自動で減り、足りなくなったメニューはお客様画面で「売り切れ」になります。空欄にすると無制限です。</p>
      <div id="stock-container"></div>
    </section>

    <!-- 集計 -->
    <section id="view-report" class="admin-view">
      <p class="view-note">完了（会計・受け取り済み）の注文のみ集計しています。原価：焼き鳥 30円/本、スープ 約3円/杯</p>
      <div id="report-container"></div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
